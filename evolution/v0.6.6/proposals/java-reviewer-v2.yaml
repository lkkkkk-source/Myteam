non_changes:
  - 不删除 v1 任一审查维度（纯加法）
  - 不改"只提问题不改代码"约束
  - 不改 team / capabilities / quality_rules

rationale:
  - 对齐 java-developer v2 的 Evidence / Guardrail 模式，跨 Agent 一致
  - 解决 v0.6.3 审计中审查"论断无证据、遗漏维度"的差距
