# ===================== 依赖追踪（dependency tracking）=====================
# 用于升级排序 / 一致性校验 / 回滚影响面分析。
# 依赖含义：升级 A 时，若 A.depends_on 中某前置 Agent 版本落后于其下游期望，
# 需先评估协同性；回滚 A 时需检查 depends_on 它 的下游 Agent 是否受影响。
dependency_graph:
  topological_hint:
    - layer: 0   # 无前置
      agents: [java-architect, requirement-agent, discussion-agent, solution-architect,
               literature-agent, experiment-agent, research-analyst, innovation-agent,
               writing-agent, ppt-agent, resume-agent, engops-lead, release-agent,
               git-manager, project-health-agent, adr-recorder, project-knowledge-manager,
               task-memory-agent]
    - layer: 1   # 依赖 layer 0
      agents: [java-developer, java-planner, java-reviewer, java-tester,
               changelog-agent, editor-agent, paper-writer]
    - layer: 2   # 依赖 layer 1
      agents: [java-debugger]
    - layer: 3   # lead / 顶层
      agents: [java-lead, research-lead, creative-lead, project-manager-agent]

# 升级批次（本次 v0.6.6 released）
