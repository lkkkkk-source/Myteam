# Agent Version Registry (v0.6.6)
# -----------------------------------------------------------------------------
# 中心版本注册表：为 30 个 Agent 提供「持续版本化演进」的单一权威数据源。
# 设计原则：
#   - 不新增 / 不删除 Agent（数量恒为 30），只管理 prompt 版本
#   - 每个 agent 记录：当前版本、版本状态、依赖（升级需先到位的前置 Agent）
#   - version 单调递增（v1 < v2 < ...），旧版本永不覆盖（可回滚）
#   - 本文件只登记元数据，不决定执行；执行归各 Agent
#   - 升级流程：proposed -> approved -> benchmarked -> applied -> released
#     （任一阶段可 reject / roll-back，见 evolution/evolution-state.yaml）
# -----------------------------------------------------------------------------

version_registry_version: 1
platform: opencode-agent-platform
generated_at: "2026-09-21"
owner: engops-lead
total_agents: 30
baseline: { agent: 30, mcp: 5, skill: 26, workflow: 8 }

# Organization Model reference (v1.4.3)
# 本 registry 的 `team:` 字段沿用原始域名（java/advisory/research/creative/engops/knowledge/memory/pm），
# 不改动；Team Organization Model（Team -> Role -> Agent）在 platform/organization/ 层建模，
# 通过 agent-role-binding.yaml 提供 6-team 组织映射（software-engineering 等），只引用不替代（org-4）。
organization_model_ref:
  layer: "platform/organization/"
  binding: "platform/organization/agent-role-binding.yaml"
  state: ".ai/context/organization/organization-state.yaml"
  note: "org 只建模/映射/查询/验证，不改本 registry 的 agent team 字段；30/30 全覆盖"

# Organization Intelligence reference (v1.5)
# Self-Observing Agent Organization：只读历史运行数据做分析/报告/建议，不改本 registry、不改任何来源。
organization_intelligence_ref:
  layer: "platform/organization-intelligence/"
  report: "platform/organization-intelligence/reports/organization-intelligence-report.yaml"
  state: ".ai/context/organization-intelligence/intelligence-state.yaml"
  note: "只分析/只报告/只建议；read-only；recommendation 须人工审批，不自动应用；不生成 Agent 排名"

# 版本状态机（state lifecycle）：
#   v0: untouched        # 从未升级，沿用 v1 基线
#   vN: released         # 已合并到 source/prompts + agents，构建通过
#   vN-proposed:         # 提案已生成，未批准
#   vN-rejected:         # 被拒绝，未覆盖 source
#   vN-rollback:         # 已回退到前一版本
states:
  - untouched
  - proposed
  - approved
  - benchmarked
  - applied
  - released
  - rejected
  - rollback

# ===================== 版本注册（30 Agent）=====================
# version: 当前 source 中生效的 prompt 版本
# state:   状态机取值
# team:    所属 team（对齐 .ai/context/team-registry.yaml）
# depends_on: 依赖的前置 Agent（升级/协同时需先到位，做依赖追踪）
# note:     本次升级记录

