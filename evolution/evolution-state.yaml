# Agent Evolution State (v0.6.6)
# -----------------------------------------------------------------------------
# Evolution State：追踪每个 Agent 当前所处的「进化生命周期」状态。
# 状态机（与 version-registry.yaml 的 states 一致）：
#
#   untouched ──> proposed ──> approved ──> benchmarked ──> applied ──> released
#      │             │             │                           │
#      │             └── rejected  │                           └──> rollback
#      │                 (reject)  │
#      └───────────────────────────┘ (reject 不覆盖 source)
#
# 语义：
#   untouched   : 保持 v1 基线，从未进入升级流程
#   proposed    : 提案已生成（evolution/v0.6.6/proposals/{agent}-v{n}.yaml）
#   approved    : 提案经评审通过，允许生成新版本
#   benchmarked : 已跑 benchmark，得到 decision
#   applied     : 已生成 applied/{agent}-v{n}.md（新版本文件，不覆盖旧版本）
#   released    : 已合并到 source/prompts + agents，构建通过（可在 Registry 标 released）
#   rejected    : 提案被拒，source 保持原样（critical：不得覆盖 source）
#   rollback    : 已从 vN 回退到 vN-1（source 恢复前一版本）
#
# 本文件是「当前时刻」的操作快照；历史全量见 history/。由 engops-lead 维护，
# project-health-agent 只读校验，project-manager-agent 只读参考。
# -----------------------------------------------------------------------------

