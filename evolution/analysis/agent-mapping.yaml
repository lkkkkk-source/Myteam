# Agent Mapping — external agency-agents → internal MyTeam agents

> 只做映射与研究，不合并、不替换、不新增 Agent。内部基线保持 Agent=30。

## Mapping Rationale
- 外部 agent 按**能力域**映射到内部已有 Agent，而非一一对应（外部 264，内部 30）。
- 映射类型：
  - `matched` — 能力高度重合，内部已有等价 Agent，可参考外部提升专业度
  - `partial` — 部分能力重合，内部 Agent 可借鉴其中某维度
  - `no-internal` — 内部无对应，仅记录参考（不新增 Agent）

