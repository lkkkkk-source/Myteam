# =====================================================================
# Organization Intelligence Schema — v1.5
# =====================================================================
# 目标：让 MyTeam 从 Agent Organization Model 升级为
#       Self-Observing Agent Organization（自观察组织）。
#
#   读取历史运行数据 → 分析组织运行状态 → 生成洞察 → 生成优化建议。
#
# 本层【只分析 / 只报告 / 只建议】：
#   - 只读历史数据，不修改任何来源数据。
#   - 不自动修改 Agent / Team / Role / Workflow / Prompt / Router / Model Routing。
#   - 所有 Recommendation 必须经人工审批（draft → review → approved/rejected）。
#   - 不生成 Agent 排名（无 best_agent / worst_agent）；面向流程，不评价个人。
#
# 阶段：v1.5 · MyTeam Organization Intelligence Layer
# 基线：Agent=30 · MCP=5 · Skill=26 · Workflow=8（强制不变）
# =====================================================================

version: 1
layer: "organization-intelligence"
stage: "v1.5"
principle: "analyze-report-recommend-only"
schema_for: "platform/organization-intelligence/**/*.yaml + .ai/context/organization-intelligence/*.yaml"

# ---------------------------------------------------------------------
# Intelligence 记录结构
# ---------------------------------------------------------------------
intelligence:
  - field: "intelligence_id"
    type: "string"
    required: true            # OI-NNNN
  - field: "time_range"
    type: "string"
    required: true            # 分析时间窗（如 2026-09-01..2026-09-23）
  - field: "scope"
    type: "enum"
    values: [ "team", "role", "agent", "workflow", "collaboration" ]
    required: true
  - field: "source_refs"
    type: "list"
    required: true            # 只读来源（trace / collaboration / execution / safety / analytics ...）
  - field: "metrics"
    type: "map"
    required: true            # 聚合统计（只统计，不评分个人）
  - field: "insights"
    type: "list"
    required: false           # 洞察（含 evidence_refs）
  - field: "recommendations"
    type: "list"
    required: false           # 建议（draft，需人工审批）

# ---------------------------------------------------------------------
# 允许读取的数据来源（只读，禁止修改）
# ---------------------------------------------------------------------
allowed_sources:
  organization: [ "platform/organization/agent-role-binding.yaml", ".ai/context/organization/organization-state.yaml" ]
  trace:        [ ".ai/context/debug-trace/trace-index.yaml", ".ai/context/debug-trace/events/*.yaml" ]
  collaboration:[ ".ai/context/collaboration/messages/*.yaml", ".ai/context/collaboration/handoffs/*.yaml", ".ai/context/collaboration/decisions/*.yaml", ".ai/context/collaboration/conflicts/*.yaml" ]
  workspace:    [ ".ai/context/workspace/changes/*.yaml", ".ai/context/workspace/snapshots/*.yaml", ".ai/context/workspace/merge/*.yaml" ]
  execution:    [ ".ai/context/execution-engine/execution-results.yaml", ".ai/context/execution-engine/engine-state.yaml" ]
  safety:       [ ".ai/context/runtime-safety/safety-state.yaml", ".ai/context/runtime-safety/escalations.yaml" ]
  analytics:    [ ".ai/context/analytics/reports/analytics-report.yaml", ".ai/context/quality/gate-state.yaml" ]

read_only: true
mutates_sources: false

# ---------------------------------------------------------------------
# 验收不变量（Intelligence 铁律）
# ---------------------------------------------------------------------
invariants:
  - "oi-1: 只分析 / 只报告 / 只建议；不修改任何来源数据（read-only）"
  - "oi-2: 不自动修改 Agent / Team / Role / Workflow / Prompt / Router Rules / Model Routing"
  - "oi-3: 所有 recommendation 必须人工审批（draft → review → approved/rejected），不自动执行/不自动进入 source"
  - "oi-4: 面向流程与组织，不评价个人；禁止 Agent 排名（无 best_agent / worst_agent）"
  - "oi-5: 每条 insight / recommendation 必须带 evidence_refs（可追溯真实来源）"
  - "oi-6: metrics 只聚合统计，不改变来源数据、不改变 30 Agent 能力"
  - "oi-7: 基线不变（Agent=30 / MCP=5 / Skill=26 / Workflow=8）"

# ---------------------------------------------------------------------
# 禁止字段（出现即 Intelligence 违规）
# ---------------------------------------------------------------------
forbidden_fields:
  - "auto_apply"
  - "auto_modify"
  - "auto_execute"
  note: "intelligence / recommendation 记录不得出现自动应用 / 自动修改 / 自动执行字段"

not_implemented:
  - "auto-apply-recommendation"
  - "auto-modify-agent"
  - "auto-add-team"
  - "auto-delete-role"
  - "auto-adjust-workflow"
  - "auto-modify-prompt"
  - "auto-change-router-rules"
  - "auto-change-model-routing"
  - "agent-ranking"                   # 禁止 best_agent / worst_agent
  - "intelligence-as-executor"
