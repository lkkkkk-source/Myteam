    description: "review stage duration increasing (quality/review 15m, reviewer cycle_time 2.4h, rework_rate 0.18)"
    severity: "medium"
    evidence_refs: [ "TR-0001#EV-0009", "workflow-metrics#quality/review", "role-performance#reviewer" ]
  - finding: "integration_test_failure_point"
    description: "integration-testing validation first-use failure at refund step-4"
    severity: "medium"
    evidence_refs: [ "gate-state#validation", "analytics-report#integration-testing" ]
  - finding: "dev_test_handoff_friction"
    description: "developer→tester handoff success_rate (0.90) 低于上游 architect→developer (0.95)"
    severity: "low"
    evidence_refs: [ "HO-0002", "collaboration-metrics#developer-tester" ]

summary:
  total_findings: 3
  note: "findings are observations with evidence only; workflow NOT modified (oi-2)"

boundaries:
  - "只发现瓶颈 + 提供 evidence；禁止直接修改 workflow（oi-2）"
  - "每条 finding 必须带 evidence_refs（oi-5）"
