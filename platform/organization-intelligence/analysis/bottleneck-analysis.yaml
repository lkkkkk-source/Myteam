# Bottleneck Analysis — v1.5
# 发现流程瓶颈；每条 finding 必须含 evidence_refs。禁止直接修改 workflow（oi-2）。
version: 1
layer: "organization-intelligence-bottleneck"
stage: "v1.5"
owner: "engops-lead"
scope: "workflow"
time_range: "2026-09-01..2026-09-23"
read_only: true

source_refs:
  - "platform/organization-intelligence/metrics/workflow-metrics.yaml"
  - "platform/organization-intelligence/metrics/role-performance.yaml"
  - ".ai/context/debug-trace/events/TR-0001-events.yaml"

findings:
