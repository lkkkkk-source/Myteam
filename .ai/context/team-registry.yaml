# Team Registry v0.6.4 (Generic)

version: 1
updated_at: "2026-09-21T15:00:00"
# 通用 Team 注册表（v0.6.4）
# 所有 Team 信息集中在此，不再硬编码在 Router rules / capability / context

# Organization reference (v1.4.3) — 本文件保持为 Team Runtime Registry，不被替代（org-4）。
# Team Organization Model（Team -> Role -> Agent）在 platform/organization/ 层建模，
# 只【引用】本 registry（registry_ref），不改动本文件已有 team 条目。
organization_ref:
  layer: "platform/organization/"
  model: "Team -> Role -> Agent"
  binding: "platform/organization/agent-role-binding.yaml"
  state: ".ai/context/organization/organization-state.yaml"
  note: "organization 只引用本 registry 作为 Runtime Registry，不替代（org-4）"
  registry_role: "Team Runtime Registry"

teams:
  - id: "java"
    name: "Java Engineering Team"
    lead: "java-lead"
    specialists: ["java-architect", "java-developer", "java-reviewer", "java-tester", "java-planner", "java-debugger"]
    workflows:
      - "java-feature-development"
      - "java-refactor"
      - "java-debug"
    capabilities:
      - "spring-boot"
      - "mybatis"
      - "java-core"
      - "tdd"
      - "sql"
      - "database"
    quality_rules:
      - "strict-dependency-direction"
      - "minimal-change"
      - "api-contract-first"
    status: "active"
    domain: "software-engineering"

  - id: "research"
    name: "Research Team"
    lead: "research-lead"
    specialists: ["literature-agent", "research-analyst", "experiment-agent", "innovation-agent", "paper-writer"]
    workflows:
