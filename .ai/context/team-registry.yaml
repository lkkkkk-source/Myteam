# Team Registry 规则
# 1. 新增 Team 时，只需添加此文件，不改 Router rules / capability registry
# 2. Router 需支持 Generic 模式：未匹配任何具体 team 规则时，走 generic 路径
# 3. Capability 注册表保持 30 Agent，不因 Team 抽象而变化
